<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Browser tab title -->
    <title>Add Employee</title>

    <!-- External CSS file -->
    <link rel="stylesheet" href="css/style.css">
</head>

<!-- Check login -->
<body onload="checkLogin();">

    <!-- Main center container -->
    <div class="center-box">

        <!-- Card -->
        <div class="card">

            <!-- Page heading -->
            <h2>Add Employee</h2>

            <!-- Input fields -->
            <input id="name" placeholder="Full Name">
            <input id="empId" placeholder="Employee ID">
            <input id="email" placeholder="Mail ID">
            <input id="department" placeholder="Department">
            <input id="designation" placeholder="Designation">
            <input id="category" placeholder="Category">

            <!-- Generate QR button -->
            <button onclick="addEmployee()">Generate QR</button>

            <!-- QR area -->
            <div id="qrcode" class="qr-box"></div>

            <!-- Download QR button -->
            <button id="downloadBtn" style="display:none;" onclick="downloadQR()">
                Download QR
            </button>

            <!-- Back button -->
            <button onclick="window.location.href='dashboard.html'">
                Back
            </button>

        </div>
    </div>

    <!-- Toast box -->
    <div id="toast"></div>

    <!-- QR library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- JS files -->
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
    <script src="js/api.js"></script>
    <script src="js/qr.js"></script>

    <script>

        /* Add employee */
        async function addEmployee() {

            /* Create employee object */
            let emp = {
                name: document.getElementById("name").value.trim(),
                empId: document.getElementById("empId").value.trim(),
                email: document.getElementById("email").value.trim(),
                department: document.getElementById("department").value.trim(),
                designation: document.getElementById("designation").value.trim(),
                category: document.getElementById("category").value.trim()
            };

            /* Validation */
            if (
                !emp.name ||
                !emp.empId ||
                !emp.email ||
                !emp.department ||
                !emp.designation ||
                !emp.category
            ) {
                showToast("Please fill all fields");
                return;
            }

            try {

                /* Save employee in backend */
                let savedEmployee = await addEmployeeAPI(emp);

                /* Generate permanent QR using backend qrId */
                generateQRCode("qrcode", savedEmployee);

                /* Show download button */
                document.getElementById("downloadBtn").style.display = "block";

                /* Success message */
                showToast("Employee added and QR generated");

            } catch (error) {

                /* Show backend error */
                showToast(error.message || "Employee add failed");
            }
        }

    </script>

</body>
</html>
