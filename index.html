<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Browser tab title -->

    <!-- External CSS file -->

</head>
<body>

    <!-- Main center container -->
    <div class="center-box">

        <!-- Login card -->

            <!-- Email input -->

            <!-- Password input -->

            <!-- Login button -->

            <!-- Default login details -->
            <p class="hint">
                Default: debanshusekhar55@gmail.com / 1234
            </p>

        </div>
    </div>

    <!-- JS files -->
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>

</body>
</html>
